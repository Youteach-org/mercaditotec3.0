name: Diagnose Mercadito session and production API

on:
  push:
    branches:
      - fix/mercadito-session-runtime-diagnostics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: "043e7755b65ac4fc8b8572963a544340"
      PRODUCTION_WORKER_NAME: mercaditotec3-0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check app APIs without disclosing user data
        shell: bash
        run: |
          set -u
          for url in \
            "https://mercaditotec3-0.youteach-tk.workers.dev/api/marketplace" \
            "https://mercaditotec.store/api/marketplace" \
            "https://mercaditotec3-0.youteach-tk.workers.dev/__health" \
            "https://mercaditotec3-0.youteach-tk.workers.dev/api/admin/users"; do
            status="$(curl -L -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$url" || true)"
            printf '%s HTTP %s\n' "$url" "$status"
          done
      - name: Inspect Cloudflare secret binding metadata only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN GitHub secret unavailable"; exit 1; }
          status="$(curl -sS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o /tmp/worker-settings.json \
            -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME/settings")"
          echo "Worker settings HTTP $status"
          test "$status" = "200" || { echo "::error::Unable to inspect Cloudflare Worker settings"; exit 1; }
          jq -e '.success == true' /tmp/worker-settings.json >/dev/null
          # Output only whether secret binding exists. Never print secret payload or other settings.
          secret_type="$(jq -r '[.result.bindings[]? | select(.name == "FIREBASE_SERVICE_ACCOUNT_JSON") | .type] | first // "absent"' /tmp/worker-settings.json)"
          case "$secret_type" in
            secret_text|secret_key) echo "FIREBASE_SERVICE_ACCOUNT_JSON binding: PRESENT ($secret_type)" ;;
            *) echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON binding missing or wrong type ($secret_type)"; exit 1 ;;
          esac
      - name: Collect sanitized marketplace backend error from Cloudflare Tail
        shell: bash
        run: |
          set -u
          npm install --no-audit --no-fund --ignore-scripts --prefix /tmp/wrangler-cli wrangler@4.132.0 >/dev/null 2>&1
          timeout 35s /tmp/wrangler-cli/node_modules/.bin/wrangler tail "$PRODUCTION_WORKER_NAME" --format json > /tmp/tail-output.jsonl 2> /tmp/tail-error.log &
          tail_pid=$!
          sleep 10
          for retry in 1 2 3; do
            curl -L -sS --connect-timeout 10 --max-time 25 -o /dev/null "https://mercaditotec3-0.youteach-tk.workers.dev/api/marketplace?session_diagnostic=$retry" || true
            sleep 2
          done
          wait "$tail_pid" || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          found = False
          for line in Path("/tmp/tail-output.jsonl").read_text(errors="replace").splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              for _ in range(5):
                  if not isinstance(event, str):
                      break
                  try:
                      next_event = json.loads(event)
                  except json.JSONDecodeError:
                      break
                  if next_event == event:
                      break
                  event = next_event
              if isinstance(event, str) and "PUBLIC_MARKETPLACE_RUNTIME_ERROR" in event:
                  import re
                  pos = event.index("PUBLIC_MARKETPLACE_RUNTIME_ERROR")
                  excerpt = event[pos:pos+700]
                  excerpt = re.sub(r"[A-Za-z0-9_/-]{32,}", "[redacted]", excerpt)
                  print("API diagnostic raw:", excerpt)
                  found = True
                  continue
              if not isinstance(event, dict):
                  continue
              raw_logs = event.get("logs", [])
              if not isinstance(raw_logs, list):
                  continue
              for entry in raw_logs:
                  if isinstance(entry, dict):
                      msg = entry.get("message", [])
                  elif isinstance(entry, str):
                      msg = [entry]
                  else:
                      continue
                  if isinstance(msg, str):
                      msg = [msg]
                  if isinstance(msg, list) and any(isinstance(v, str) and "PUBLIC_MARKETPLACE_RUNTIME_ERROR" in v for v in msg):
                      print("API diagnostic:", " | ".join(str(v)[:240] for v in msg[:3])[:500])
                      found = True
          if not found:
              import collections
              data = Path("/tmp/tail-output.jsonl").read_text(errors="replace")
              events = []
              for line in data.splitlines():
                  try: events.append(json.loads(line))
                  except json.JSONDecodeError: pass
              types = collections.Counter(type(event).__name__ for event in events)
              print("Parsed tail event types:", dict(types))
              print("Raw log fingerprint:", {key: data.count(key) for key in ["PUBLIC_MARKETPLACE_RUNTIME_ERROR", "exception", "Error", "error", "FAILED", "GET /api/marketplace"]})
              if "PUBLIC_MARKETPLACE_RUNTIME_ERROR" in data:
                  import re
                  start = data.index("PUBLIC_MARKETPLACE_RUNTIME_ERROR")
                  excerpt = data[start:start+450]
                  excerpt = re.sub(r"[A-Za-z0-9_/-]{26,}", "[redacted]", excerpt)
                  print("API diagnostic excerpt:", excerpt.replace("\\\\n", " ")[:450])

              for event in [event for event in events if isinstance(event, dict)][:2]:
                  print("Tail structure:", list(event.keys()), "outcome:", str(event.get("outcome", ""))[:100], "log-types:", [type(v).__name__ for v in event.get("logs", [])[:2]] if isinstance(event.get("logs", []), list) else "not-list")
                  for ex in event.get("exceptions", [])[:1] if isinstance(event.get("exceptions", []), list) else []:
                      print("Exception type:", str(ex.get("name", "unknown"))[:100] if isinstance(ex, dict) else type(ex).__name__)
              print("No sanitized diagnostic event captured.")
              print("Tail file size:", Path("/tmp/tail-output.jsonl").stat().st_size)
              tail_errors = Path("/tmp/tail-error.log").read_text(errors="replace")
              safe_errors = [line for line in tail_errors.splitlines() if "Error" in line or "error" in line or "code:" in line]
              for line in safe_errors[:5]:
                  import re
                  print("Tail diagnostic:", re.sub(r"[A-Za-z0-9_-]{26,}", "[redacted]", line)[:300])

          PY
