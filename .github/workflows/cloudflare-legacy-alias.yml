name: Restore Mercadito stable URL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-alias:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy mercaditotec stable alias
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "043e7755b65ac4fc8b8572963a544340"
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not available in Youteach-org/mercaditotec3.0"
            exit 1
          fi

          npx --yes wrangler@4.132.0 deploy --config wrangler.legacy-alias.jsonc

      - name: Verify stable URL redirects to live Worker
        run: |
          set -euo pipefail
          LEGACY="https://mercaditotec.youteach-tk.workers.dev/marketplace"
          TARGET_HOST="mercaditotec3-0.youteach-tk.workers.dev"

          ok=0
          for attempt in $(seq 1 12); do
            headers="$(curl -sS -D - -o /dev/null --max-redirs 0 "$LEGACY" || true)"
            status="$(printf '%s\n' "$headers" | head -n 1 | awk '{print $2}')"
            location="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/, "", $2); print $2; exit}')"

            echo "Attempt $attempt: HTTP ${status:-none} Location: ${location:-none}"

            if [ "$status" = "308" ]; then
              case "$location" in
                https://$TARGET_HOST/marketplace*)
                  ok=1
                  break
                  ;;
              esac
            fi

            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "::error::Stable Mercadito URL did not expose the expected 308 redirect after retries"
            exit 1
          fi

          final_status="$(curl -L -sS -o /tmp/mercadito-stable -w '%{http_code}' "$LEGACY")"
          if [ "$final_status" -lt 200 ] || [ "$final_status" -ge 400 ]; then
            echo "::error::Stable Mercadito URL did not reach a healthy page; HTTP $final_status"
            exit 1
          fi

          echo "Stable Mercadito URL is healthy; final HTTP $final_status"
