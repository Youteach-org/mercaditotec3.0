name: Mercadito runtime smoke

on:
  push:
    branches:
      - feature/student-stores
    paths:
      - ".github/workflows/cloudflare-runtime-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public Worker runtime and browser assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mercaditotec3-0.youteach-tk.workers.dev"

          probe() {
            local path="$1"
            local file="$2"
            local status
            status="$(curl -L -sS --connect-timeout 15 --max-time 45 -o "$file" -w '%{http_code}' "$BASE$path")"
            echo "===== $path ====="
            echo "HTTP $status"

            case "$status" in
              2*|3*) ;;
              *)
                echo "::error::$path returned HTTP $status"
                head -c 4000 "$file" 2>/dev/null || true
                return 1
                ;;
            esac
          }

          echo "Waiting for the integrated MercaditoTec build to reach the production Worker..."
          icon_ready=0
          for attempt in {1..30}; do
            icon_status="$(curl -L -sS --connect-timeout 15 --max-time 45 -o /tmp/mercadito-icon.svg -w '%{http_code}' "$BASE/icon.svg" || true)"
            if [ "$icon_status" = "200" ] && grep -q "MercaditoTec" /tmp/mercadito-icon.svg; then
              icon_ready=1
              echo "MercaditoTec app icon is live on production."
              break
            fi
            echo "Attempt $attempt/30: production has not received the integrated build yet (icon HTTP $icon_status)."
            sleep 10
          done

          if [ "$icon_ready" -ne 1 ]; then
            echo "::error::Production Worker did not receive the integrated MercaditoTec build in time"
            head -c 1000 /tmp/mercadito-icon.svg 2>/dev/null || true
            exit 1
          fi

          probe "/__health" /tmp/health.txt
          probe "/__probe" /tmp/probe.txt
          probe "/" /tmp/root.html
          probe "/marketplace" /tmp/marketplace.html
          probe "/api/marketplace" /tmp/marketplace.json
          probe "/icon.svg" /tmp/icon.svg

          grep -q "MercaditoTec" /tmp/icon.svg || {
            echo "::error::Production browser icon is not the MercaditoTec icon"
            exit 1
          }

          grep -q '"firebaseSecretPresent": true' /tmp/health.txt || {
            echo "::error::Cloudflare runtime does not expose FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          }

          grep -q '"pathname": "/marketplace"' /tmp/probe.txt || {
            echo "::error::OpenNext probe did not exercise /marketplace"
            exit 1
          }

          grep -q '"status": 200' /tmp/probe.txt || {
            echo "::error::OpenNext probe did not report HTTP 200"
            exit 1
          }

          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import pathlib

          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.urls.append(attrs["src"])
                  if tag == "link" and attrs.get("rel") == "stylesheet" and attrs.get("href"):
                      self.urls.append(attrs["href"])

          parser = Assets()
          parser.feed(pathlib.Path("/tmp/marketplace.html").read_text(errors="replace"))
          urls = []
          for u in parser.urls:
              full = urljoin("https://mercaditotec3-0.youteach-tk.workers.dev/marketplace", u)
              if full not in urls:
                  urls.append(full)

          if not urls:
              raise SystemExit("No browser JS/CSS assets found in /marketplace HTML")

          pathlib.Path("/tmp/browser-assets.txt").write_text("\n".join(urls) + "\n")
          print(f"Found {len(urls)} browser assets")
          PY

          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            status="$(curl -L -sS --connect-timeout 15 --max-time 45 -o /tmp/asset-body -w '%{http_code}' "$asset")"
            echo "Asset HTTP $status: $asset"
            case "$status" in
              2*|3*) ;;
              *)
                echo "::error::Browser asset returned HTTP $status: $asset"
                head -c 1000 /tmp/asset-body 2>/dev/null || true
                exit 1
                ;;
            esac
          done < /tmp/browser-assets.txt

          echo "Mercadito Worker, marketplace API, and browser JS/CSS assets are reachable."

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chromium/Chrome binary is available on the GitHub runner"
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=10000 \
            --dump-dom \
            "$BASE/marketplace?smoke=$(date +%s)" \
            > /tmp/browser-dom.html \
            2> /tmp/browser-console.txt || {
              echo "::error::Headless browser failed to load Mercadito"
              tail -n 200 /tmp/browser-console.txt || true
              exit 1
            }

          if grep -q 'aria-busy="true"' /tmp/browser-dom.html; then
            echo "::error::Mercadito remained stuck in the client-side loading shell"
            tail -n 200 /tmp/browser-console.txt || true
            head -c 5000 /tmp/browser-dom.html || true
            exit 1
          fi

          grep -q "Tiendas de la comunidad" /tmp/browser-dom.html || {
            echo "::error::Marketplace UI did not hydrate in a real browser"
            tail -n 200 /tmp/browser-console.txt || true
            head -c 5000 /tmp/browser-dom.html || true
            exit 1
          }

          echo "Headless Chrome rendered the hydrated Mercadito marketplace successfully."

          LEGACY="https://mercaditotec.youteach-tk.workers.dev"
          legacy_status="$(curl -L -sS --connect-timeout 15 --max-time 45 -o /tmp/legacy-body -w '%{http_code}' "$LEGACY/" || true)"
          echo "Legacy Mercadito URL HTTP $legacy_status: $LEGACY/"
          head -c 1000 /tmp/legacy-body 2>/dev/null || true
