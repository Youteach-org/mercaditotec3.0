name: Marketplace canonical visual capture

on:
  push:
    branches:
      - preview/marketplace-approved-reference
    paths:
      - "app/marketplace/**"
      - "app/globals.css"
      - "components/AppShell.tsx"
      - "components/store/MarketplaceCloudMedia.tsx"
      - "lib/store/demoMarketplace.ts"
      - ".github/workflows/marketplace-preview-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-canonical-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build local production preview
        run: npx next build --webpack

      - name: Start local Next server
        shell: bash
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/mercadito-next.log 2>&1 &
          echo $! > /tmp/mercadito-next.pid
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:3000/marketplace?visual=1" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/mercadito-next.log
          exit 1

      - name: Capture canonical viewport
        shell: bash
        run: |
          mkdir -p visual-output
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME"             --headless=new             --no-sandbox             --disable-gpu             --disable-dev-shm-usage             --hide-scrollbars             --force-device-scale-factor=1             --window-size=1448,1086             --virtual-time-budget=12000             --screenshot=visual-output/marketplace-current.png             "http://127.0.0.1:3000/marketplace?visual=1"
          test -s visual-output/marketplace-current.png

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --window-size=412,915 \
            --virtual-time-budget=12000 \
            --screenshot=visual-output/marketplace-mobile.png \
            "http://127.0.0.1:3000/marketplace?visual=1"
          test -s visual-output/marketplace-mobile.png

      - name: Upload visual capture
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-canonical-preview
          path: |
            visual-output/marketplace-current.png
            visual-output/marketplace-mobile.png
          if-no-files-found: error
          retention-days: 14
