name: Build native MercaditoTec Android APK

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-native-build.yml"
  push:
    branches:
      - feature/android-native-kotlin
    paths:
      - "android/**"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK using hosted runner tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Build real native debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK for Android device testing
        uses: actions/upload-artifact@v4
        with:
          name: mercaditotec-android-nativo-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
