<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b83">
  <title>Sin conexión · MercaditoTec</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh; margin: 0; display: grid; place-items: center;
      background: #fff9ee; color: #123b83; font-family: system-ui, sans-serif;
      padding: 24px;
    }
    main { width: min(100%, 450px); text-align: center; }
    .mark { font-size: 55px; line-height: 1; }
    h1 { margin: 24px 0 10px; font-size: clamp(26px, 7vw, 38px); }
    p { color: #2c4366; font-size: 17px; line-height: 1.6; }
    a {
      display: inline-block; margin-top: 12px; padding: 13px 25px;
      border-radius: 999px; background: #123b83; color: #fff;
      font-weight: 750; text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #f47b3f; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🏪</div>
    <h1>MercaditoTec</h1>
    <p>No hay conexión a Internet. Por seguridad, tus chats, publicaciones y datos de cuenta no se guardan sin conexión.</p>
    <a href="/marketplace">Volver a intentar</a>
  </main>
</body>
</html>
